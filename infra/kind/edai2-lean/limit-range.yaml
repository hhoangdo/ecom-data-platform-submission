apiVersion: v1
kind: LimitRange
metadata:
  name: edai2-lean-container-bounds
  namespace: edai2-lean
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "1"
        memory: 1Gi
