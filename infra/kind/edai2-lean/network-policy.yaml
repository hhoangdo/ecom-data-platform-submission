apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edai2-lean-default-deny
  namespace: edai2-lean
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edai2-retrieval-kind-dns-and-probes
  namespace: edai2-lean
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edai2-retrieval-kind
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
