apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-comparison
  namespace: edai2
  annotations: { edai2.replica-states: "comparison: 0" }
spec:
  replicas: 0
  selector: { matchLabels: { app: llmd-comparison } }
  template:
    metadata: { labels: { app: llmd-comparison } }
    spec:
      containers:
        - name: model
          image: ghcr.io/llm-d/llm-d-cpu:v0.7.0@sha256:f4abcce2b3a3c00521d220dfeabe7aeb5b800823451f8f49fc2b3f9cb5441584
          args: [--model, Qwen/Qwen2.5-0.5B-Instruct, --max-model-len, "4096"]
          resources: { requests: { cpu: "1", memory: 2Gi } }
