apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-comparison
  namespace: edai2
  annotations: { edai2.replica-states: "comparison-core: 0; comparison-model-ab: 1; comparison-factorial: 2" }
spec:
  replicas: 0
  selector: { matchLabels: { app: llmd-comparison } }
  template:
    metadata: { labels: { app: llmd-comparison } }
    spec:
      containers:
        - name: model
          image: ghcr.io/llm-d/llm-d-cpu:v0.7.0
          args: [--model, Qwen/Qwen2.5-0.5B-Instruct, --max-model-len, "4096"]
          resources: { requests: { cpu: "1", memory: 2Gi } }
