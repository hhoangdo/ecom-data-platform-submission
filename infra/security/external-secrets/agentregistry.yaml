apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: agentregistry }
spec: { refreshInterval: 1h, secretStoreRef: { name: edai2-vault, kind: ClusterSecretStore }, target: { name: agentregistry }, data: [{ secretKey: api-token, remoteRef: { key: edai2/platform/agentregistry, property: api-token } }, { secretKey: session-secret, remoteRef: { key: edai2/platform/agentregistry, property: session-secret } }] }
