apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-auth-facade-coordinator
  namespace: edai2
  labels:
    edai2.gateway-auth-route: facade-coordinator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: edai2-vault
    kind: ClusterSecretStore
  target:
    name: gateway-auth-facade-coordinator
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          edai2.gateway-auth-route: facade-coordinator
      data:
        facade-coordinator: '{{ dict "key" .gatewayKey "metadata" (dict "route" "facade-coordinator") | toJson }}'
  data:
    - secretKey: gatewayKey
      remoteRef:
        key: edai2/facade/gateway-entry
        property: authorization
