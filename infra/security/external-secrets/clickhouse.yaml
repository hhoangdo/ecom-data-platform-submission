apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: clickhouse }
spec: { refreshInterval: 1h, secretStoreRef: { name: edai2-vault, kind: ClusterSecretStore }, target: { name: clickhouse }, data: [{ secretKey: username, remoteRef: { key: edai2/platform/clickhouse, property: username } }, { secretKey: password, remoteRef: { key: edai2/platform/clickhouse, property: password } }] }
