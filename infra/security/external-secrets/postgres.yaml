apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: postgres }
spec: { refreshInterval: 1h, secretStoreRef: { name: edai2-vault, kind: ClusterSecretStore }, target: { name: postgres }, data: [{ secretKey: username, remoteRef: { key: edai2/platform/postgres, property: username } }, { secretKey: password, remoteRef: { key: edai2/platform/postgres, property: password } }, { secretKey: database, remoteRef: { key: edai2/platform/postgres, property: database } }] }
