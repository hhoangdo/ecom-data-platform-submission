apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-auth-drift-mcp
  namespace: edai2
  labels:
    edai2.gateway-auth-route: drift-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: edai2-vault
    kind: ClusterSecretStore
  target:
    name: gateway-auth-drift-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          edai2.gateway-auth-route: drift-mcp
      data:
        drift-mcp: '{{ dict "key" .gatewayKey "metadata" (dict "route" "drift-mcp") | toJson }}'
  data:
    - secretKey: gatewayKey
      remoteRef:
        key: edai2/kagent/gateway-keys
        property: drift-authorization
