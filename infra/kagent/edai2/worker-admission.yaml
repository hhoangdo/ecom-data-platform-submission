apiVersion: v1
kind: LimitRange
metadata:
  name: edai2-worker-defaults
  namespace: kagent
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: edai2-agent-capacity
  namespace: kagent
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 3Gi
