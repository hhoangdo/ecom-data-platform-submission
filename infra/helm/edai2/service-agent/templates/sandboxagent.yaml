{{- range .Values.sandboxAgents }}
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: {{ .resourceName }}
  namespace: {{ $.Values.namespace }}
  labels:
    edai2.logical-agent: {{ .logicalAgent | quote }}
    edai2.runtime-variant: {{ .runtimeVariant | quote }}
spec:
  platform: {{ .sandboxAgent.platform }}
  type: {{ .sandboxAgent.type }}
  declarative: {{ toYaml .sandboxAgent.declarative | nindent 4 }}
  substrate:
    workerPoolRef: {{ toYaml .sandboxAgent.substrate.workerPoolRef | nindent 6 }}
    snapshotsConfig:
      location: {{ printf "gs://%s/%s/%s/%s%s" (required "substrate.bucketName is required" $.Values.substrate.bucketName) .snapshot.prefix .snapshot.logicalAgent .snapshot.runtimeVariant .snapshot.suffix | quote }}
---
{{- end }}
