namespace: edai2
agentgatewayPolicy:
  enabled: false
workload:
  name: drift-agent
serviceAccount:
  name: edai2-drift-agent
  annotations: {}
proxy:
  url: http://edai2-private-gateway.edai2.svc.cluster.local:8080
substrate:
  # Topic 16's chart must require a non-empty Terraform-provided value at render time.
  bucketName: ""
credentialReferences:
  model:
    secretName: kagent-model-route-key
    key: api-key
  driftMcp:
    secretName: kagent-gateway-keys
    key: drift-detect
remoteMcpServers:
  - name: drift-mcp
    transport: STREAMABLE_HTTP
    url: http://drift-mcp.edai2.svc.cluster.local:8080/mcp
    credential: driftMcp
sandboxAgents:
  - resourceName: drift
    logicalAgent: drift
    runtimeVariant: v1-primary
    modelConfigRef: default-model-config
    snapshot:
      prefix: agent-substrate
      logicalAgent: drift
      runtimeVariant: v1-primary
      suffix: /
    environment:
      - name: EDAI2_LOGICAL_AGENT
        value: drift
      - name: EDAI2_RUNTIME_VARIANT
        value: v1-primary
    credentialBindings:
      - driftMcp
    tools:
      - drift-mcp
    sandboxAgent:
      platform: substrate
      type: Declarative
      declarative:
        runtime: go
      substrate:
        workerPoolRef:
          name: edai2-agents
      sandbox:
        network:
          allowedDomains:
            - kube-dns.kube-system.svc.cluster.local
            - api.ate-system.svc.cluster.local
            - atenet-router.ate-system.svc.cluster.local
            - edai2-private-gateway.edai2.svc.cluster.local
image:
  repository: us-central1-docker.pkg.dev/project-a7c45c4e-f589-4b40-b8b/edai2-drift-agent/edai2-drift-agent
  tag: 676fb9add4502681aede85c4efbcd7648a06ef07
env:
  - name: EDAI2_ENVIRONMENT
    value: gke
  - name: EDAI2_POSTGRES_DSN
    valueFrom:
      secretKeyRef: { name: edai2-postgres-app, key: dsn }
  - name: EDAI2_SECTION03_BASELINE_DATE
    value: "2026-04-10"
  - name: EDAI2_OTEL_ENDPOINT
    value: http://tempo.edai2.svc.cluster.local:4318/v1/traces
