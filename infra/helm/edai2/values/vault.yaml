service: { type: ClusterIP }
server:
  ha:
    enabled: true
    replicas: 1
    raft: { enabled: true }
  standalone: {enabled: false}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
injector:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
