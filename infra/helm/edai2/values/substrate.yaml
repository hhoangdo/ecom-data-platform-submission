service: { type: ClusterIP }
valkey: { enabled: false }
rustfs: { enabled: false }
auth:
  mode: jwt
  jwt:
    issuer: https://container.googleapis.com/v1/projects/project-a7c45c4e-f589-4b40-b8b/locations/us-central1-a/clusters/edai2
    audience: api.edai2.svc
redis:
  clusterAddress: valkey-primary.edai2.svc.cluster.local:6379
  mode: standalone
  useIAMAuth: false
  passwordFile: /run/valkey-auth/password
  passwordSecretName: valkey
  passwordSecretKey: password
atelet:
  storageBackend: gcs
  # Snapshot gs:// URIs and prefixes follow the existing ActorTemplate/RPC contract.
