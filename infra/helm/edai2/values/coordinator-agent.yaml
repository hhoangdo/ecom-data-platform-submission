namespace: edai2
agentgatewayPolicy:
  enabled: false
workload:
  name: coordinator
serviceAccount:
  name: edai2-coordinator
  annotations: {}
proxy:
  url: http://edai2-private-gateway.edai2.svc.cluster.local:8080
substrate:
  # Topic 16's chart must require a non-empty Terraform-provided value at render time.
  bucketName: ""
credentialReferences:
  model:
    secretName: kagent-model-route-key
    key: api-key
  coordinatorSpecialist:
    secretName: kagent-gateway-keys
    key: coordinator-to-specialist
  facadeCoordinator:
    secretName: facade-gateway-key
    key: authorization
facadeCredentialBinding: facadeCoordinator
remoteMcpServers: []
sandboxAgents:
  - resourceName: coordinator-v1-primary
    logicalAgent: coordinator
    runtimeVariant: v1-primary
    modelConfigRef: default-model-config
    snapshot: &v1_primary_snapshot
      prefix: agent-substrate
      logicalAgent: coordinator
      runtimeVariant: v1-primary
      suffix: /
    environment: &v1_primary_environment
      - name: EDAI2_LOGICAL_AGENT
        value: coordinator
      - name: EDAI2_RUNTIME_VARIANT
        value: v1-primary
    credentialBindings: &coordinator_credentials
      - coordinatorSpecialist
    tools: &coordinator_tools
      - support-a2a
      - drift-a2a
    sandboxAgent: &coordinator_sandbox
      platform: substrate
      type: Declarative
      declarative:
        runtime: go
      substrate:
        workerPoolRef:
          name: edai2-agents
      sandbox:
        network:
          allowedDomains:
            - kube-dns.kube-system.svc.cluster.local
            - api.ate-system.svc.cluster.local
            - atenet-router.ate-system.svc.cluster.local
            - edai2-private-gateway.edai2.svc.cluster.local
  - resourceName: coordinator-v2-primary
    logicalAgent: coordinator
    runtimeVariant: v2-primary
    modelConfigRef: default-model-config
    snapshot:
      <<: *v1_primary_snapshot
      runtimeVariant: v2-primary
    environment:
      - name: EDAI2_LOGICAL_AGENT
        value: coordinator
      - name: EDAI2_RUNTIME_VARIANT
        value: v2-primary
    credentialBindings: *coordinator_credentials
    tools: *coordinator_tools
    sandboxAgent: *coordinator_sandbox
  - resourceName: coordinator-v1-comparison
    logicalAgent: coordinator
    runtimeVariant: v1-comparison
    modelConfigRef: edai2-comparison
    snapshot:
      <<: *v1_primary_snapshot
      runtimeVariant: v1-comparison
    environment:
      - name: EDAI2_LOGICAL_AGENT
        value: coordinator
      - name: EDAI2_RUNTIME_VARIANT
        value: v1-comparison
    credentialBindings: *coordinator_credentials
    tools: *coordinator_tools
    sandboxAgent: *coordinator_sandbox
a2aTools:
  - name: support-a2a
    route: coordinator-to-support
    credential: coordinatorSpecialist
  - name: drift-a2a
    route: coordinator-to-drift
    credential: coordinatorSpecialist
image:
  repository: us-central1-docker.pkg.dev/project-a7c45c4e-f589-4b40-b8b/edai2-coordinator/edai2-coordinator
  tag: 4f36cb1d770586fb51bdc065ac9dce0d88b24420
env:
  - name: EDAI2_ENVIRONMENT
    value: gke
  - name: EDAI2_RETRIEVAL_URL
    value: http://retrieval-agent.edai2.svc.cluster.local:8080
  - name: EDAI2_LLM_URL
    value: http://llmd-router.edai2.svc.cluster.local:8000
  - name: EDAI2_LLM_API_KEY
    valueFrom:
      secretKeyRef: { name: kagent-model-route-key, key: api-key }
  - name: EDAI2_LLM_MODEL
    value: Qwen/Qwen2.5-1.5B-Instruct
  - name: EDAI2_OTEL_ENDPOINT
    value: http://tempo.edai2.svc.cluster.local:4318/v1/traces
  - name: LANGFUSE_HOST
    value: http://langfuse-web.edai2.svc.cluster.local:3000
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom:
      secretKeyRef: { name: langfuse-api, key: public-key }
  - name: LANGFUSE_SECRET_KEY
    valueFrom:
      secretKeyRef: { name: langfuse-api, key: secret-key }
extraVolumes:
  - name: rate-limit-evidence
    configMap: { name: chat-rate-limit-evidence, optional: true }
extraVolumeMounts:
  - name: rate-limit-evidence
    mountPath: /evidence
    readOnly: true
