image:
  tag: ""
workload:
  name: retrieval-agent
  command: [uvicorn, vina_bim_shop.llm.api.retrieval:app, --host, 0.0.0.0, --port, "8080"]
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
readinessProbe:
  httpGet: { path: /readyz, port: http }
livenessProbe:
  httpGet: { path: /healthz, port: http }
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
autoscaling:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.edai2.svc.cluster.local
        metricName: edai2_retrieval_rps
        threshold: "1"
        query: sum(rate(edai2_retrieval_requests_total[1m]))
