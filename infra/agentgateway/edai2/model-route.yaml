apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-route
  namespace: edai2
  labels: { edai2.route-class: model }
spec:
  parentRefs: [{ name: edai2-private-gateway }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs: [{ name: llmd-router, port: 8000 }]
