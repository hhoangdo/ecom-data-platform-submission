apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: auth-model-route
  namespace: edai2
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: model-route
  backend:
    auth:
      secretRef:
        name: kagent-model-route-key
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          edai2.gateway-auth-route: model-route
    authorization:
      action: Require
      policy:
        matchExpressions:
          - "apiKey.route == 'model-route'"
---
