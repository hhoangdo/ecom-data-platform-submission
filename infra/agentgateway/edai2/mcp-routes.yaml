apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: retrieval-mcp-route
  namespace: edai2
  labels: { edai2.route-class: retrieval-mcp }
spec:
  parentRefs: [{ name: edai2-private-gateway }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp/retrieval }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /mcp }
      backendRefs: [{ name: retrieval-mcp, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drift-mcp-route
  namespace: edai2
  labels: { edai2.route-class: drift-mcp }
spec:
  parentRefs: [{ name: edai2-private-gateway }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp/drift }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /mcp }
      backendRefs: [{ name: drift-mcp, port: 8080 }]
