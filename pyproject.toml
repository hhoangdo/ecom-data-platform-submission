[project]
name = "vina-bim-shop-coursework"
version = "0.1.0"
description = "Python-first coursework scaffold for the Vina Bim Shop data engineering and AI project."
requires-python = ">=3.12"
dependencies = [
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
  "confluent-kafka>=2.8",
  "duckdb>=1.1",
  "faker>=24.0",
  "pandas>=2.2",
  "pillow>=10.0",
  "pyarrow>=19.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "fastapi>=0.141.1",
  "pydantic>=2.13.4",
  "mcp>=1.29.0",
  "feast>=0.65.0",
  "psycopg>=3.3.4",
  "pgvector>=0.5.0",
  "sentence-transformers>=5.7.0",
  "httpx>=0.28.1",
  "prometheus-client>=0.24.1",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "langfuse>=4.14.3",
]

[dependency-groups]
dev = [
  "crosshair-tool>=0.0.109",
  "hypothesis>=6.165.2",
  "locust>=2.46.3",
  "mutmut>=3.7.0",
  "nbconvert>=7.17.1",
  "playwright>=1.62.0",
  "pytest>=8.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vina_bim_shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
